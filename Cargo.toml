[package]
name = "mako"
version = "0.3.0"
edition = "2021"
authors = ["MAKO Team"]
description = "Sovereign Edge Compute Engine (Wasmtime + libp2p P2P Mesh + Axum Ingress Gateway)"

[dependencies]
wasmtime = { version = "48.0", features = ["wat"] }
wasmtime-wasi = "48.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.53", features = ["tcp", "tokio", "noise", "yamux", "request-response", "macros", "cbor", "mdns", "kad"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit"] }
sha2 = "0.10"
wat = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 166
panic = "abort"
strip = true
